[package]
name = "gb_emulator"
version = "0.1.0"
edition = "2021"
authors = ["ImL1s"]
description = "A clean-room, zero-external-dependency Game Boy (LR35902) emulator written in Rust with SDL2 interactive frontend and headless test harness support."
license = "MIT"
repository = "https://github.com/ImL1s/gb_emulator"
keywords = ["gameboy", "emulator", "lr35902", "rust", "sdl2"]
categories = ["emulators", "games"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
log = "0.4"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2 = "0.37"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"


